name = "eko-ciscenje"
compatibility_date = "2026-04-29"
main = "worker/index.js"

[[routes]]
pattern = "eko-ciscenje.com"
custom_domain = true

[[routes]]
pattern = "eko-ciscenje.com"
custom_domain = true

[assets]
directory = "dist"
binding = "ASSETS"

[vars]
CONTACT_TO_EMAIL = "contact@eko-ciscenje.com"
CONTACT_FROM_EMAIL = "no-reply@eko-ciscenje.com"
TURNSTILE_HOSTNAMES = "eko-ciscenje.com"

[[send_email]]
name = "EMAIL"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true